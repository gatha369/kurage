<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>バーチャルクラゲ</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #01040a; }
      #app { position: fixed; inset: 0; touch-action: none; }
      #app canvas { display: block; width: 100%; height: 100%; opacity: 0; transition: opacity 1s ease; }
      #app canvas.ready { opacity: 1; }
      #loading {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        color: #6b7f99; font: 11px/1 system-ui, sans-serif; letter-spacing: 0.35em;
        transition: opacity 1s ease; pointer-events: none;
      }
      #loading.hidden { opacity: 0; }
      .lil-gui.lil-root { z-index: 10; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading">LOADING</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
