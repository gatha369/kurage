<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>バーチャルクラゲ</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #01040a; }
      #app { position: fixed; inset: 0; touch-action: none; }
      #app canvas { display: block; width: 100%; height: 100%; opacity: 0; transition: opacity 1s ease; }
      #app canvas.ready { opacity: 1; }
      #loading {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        color: #6b7f99; font: 11px/1 system-ui, sans-serif; letter-spacing: 0.35em;
        transition: opacity 1s ease; pointer-events: none;
      }
      #loading.hidden { opacity: 0; }
      .lil-gui.lil-root { z-index: 10; }
      /* スマートフォン：パネルは画面の下半分に収め、中身はスクロール */
      body.touch-ui .lil-gui.lil-root {
        top: auto !important; bottom: 0 !important; left: 0 !important; right: 0 !important;
        width: 100% !important; --width: 100%; max-height: 50vh; overflow-y: auto;
        -webkit-overflow-scrolling: touch; touch-action: pan-y;
      }
      /* 歯車ボタン：半透明で小さく、眺める邪魔にならないように */
      #gear {
        position: fixed; top: max(10px, env(safe-area-inset-top)); right: 10px; z-index: 11;
        width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.18);
        background: rgba(10, 20, 35, 0.35); color: rgba(220, 230, 245, 0.55);
        font-size: 18px; line-height: 1; padding: 0; cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      #gear.on { color: rgba(240, 245, 255, 0.9); background: rgba(10, 20, 35, 0.6); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading">LOADING</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
